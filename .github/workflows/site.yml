name: Site checks and GitHub Pages

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      social_png:
        description: 'Render PNG social cards with development-only Chromium (SVG remains the default)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check committed distribution files
        run: node build.mjs --check
      - name: Run tests
        run: node --test tests/*.test.mjs tests/*.test.cjs
      - name: Build site
        run: node build.mjs
      - name: Install optional social preview tools
        if: github.event_name == 'workflow_dispatch' && inputs.social_png
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Stage and publish optional PNG social cards
        if: github.event_name == 'workflow_dispatch' && inputs.social_png
        run: |
          node tools/render-social-previews.mjs
          node build.mjs --social-png-dir=.validation/social-png
          node build.mjs --check --social-png-dir=.validation/social-png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
