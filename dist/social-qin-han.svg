<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">秦汉帝国</title><desc id="desc">秦汉历史时间线：前247年—公元220年，对照政权、君主任期、人物与精选事件。前247年秦王政继位至公元220年曹魏代汉；秦政权复用周朝库ID（qin）并完整收录自约前890年非子受封至前206年秦亡的连续世系，卫君角（wei-r39）延续至前209年被废。跨公元纪年无零年；即位年与次年改元元年分别维护。；缩略示意，仅展示前 8 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">秦汉帝国</text><text x="64" y="122" fill="#e4c990" font-size="21">前247年—公元220年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前247年</text><path d="M452.54 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="452.54" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前131年</text><path d="M677.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="677.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前14年</text><path d="M899.54 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="899.54" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元103年</text><path d="M1124.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元220年</text><text x="64" y="221" fill="#e4eeee" font-size="18">秦（诸侯至帝国）</text><path d="M230 215H308.656652360515" stroke="#415663" stroke-width="2"/><rect x="230.00" y="205" width="2.00" height="20" rx="3" fill="#415663" opacity="1"/><rect x="230.00" y="205" width="47.96" height="20" rx="3" fill="#415663" opacity="1"/><rect x="279.88" y="205" width="21.10" height="20" rx="3" fill="#415663"