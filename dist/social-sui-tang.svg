<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">隋唐帝国（隋朝大一统、武周改制与李唐二十一帝全谱系）</title><desc id="desc">隋唐历史时间线：公元581年—公元907年，对照政权、君主任期、人物与精选事件。涵盖公元581年杨坚代北周建隋、589年平陈终结南北朝分裂、605年大运河与科举创设、隋末瓦岗军/窦建德/王世充群雄割据、618年李渊建唐至907年唐亡（含李唐全部二十一帝、690—705年武则天武周政权、吐蕃王朝、安史大燕政权及黄巢大齐政权）。；缩略示意，仅展示前 8 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">隋唐帝国（隋朝大一统、武周改制与李唐二十一帝全谱系）</text><text x="64" y="122" fill="#e4c990" font-size="21">公元581年—公元907年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元581年</text><path d="M452.13 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="452.13" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元662年</text><path d="M677.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="677.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元744年</text><path d="M899.13 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="899.13" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元825年</text><path d="M1124.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元907年</text><text x="64" y="221" fill="#e4eeee" font-size="18">南朝陈（隋平陈前夕</text><path d="M230 215H251.93865030674846" stroke="#8a684d" stroke-width="2"/><rect x="232.74" y="205" width="19.20" height="20" rx="3" fill="#8a684d" opacity="1"/><text x="64" y="260" fill="#e4eeee" font-size="18">隋朝</text><path d="M230 254H331.4662576687116