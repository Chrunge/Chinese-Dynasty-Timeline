<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">魏晋南北朝（两晋、五胡十六国与南北朝全谱系）</title><desc id="desc">魏晋南北朝历史时间线：公元265年—公元589年，对照政权、君主任期、人物与精选事件。涵盖公元265年司马炎代魏建西晋、280年太康平吴统一、304—439年五胡十六国全16政权与东晋（317—420年）并立、420—589年南朝（宋、齐、梁、陈）与北朝（北魏、东魏、西魏、北齐、北周）对峙，至589年隋文帝杨坚渡江灭陈重归大一统。；缩略示意，仅展示前 8 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">魏晋南北朝（两晋、五胡十六国与南北朝全谱系）</text><text x="64" y="122" fill="#e4c990" font-size="21">公元265年—公元589年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元265年</text><path d="M453.50 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="453.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元346年</text><path d="M677.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="677.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元427年</text><path d="M900.50 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="900.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元508年</text><path d="M1124.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元589年</text><text x="64" y="221" fill="#e4eeee" font-size="18">西晋</text><path d="M230 215H370.72222222222223" stroke="#3d5a73" stroke-width="2"/><rect x="230.00" y="205" width="68.98" height="20" rx="3" fill="#3d5a73" opacity="1"/><rect x="298.98" y="205" width="44.15" height="20" rx="3" fill="#3d5a73" opacity="1"/><rect x="343.13" y="2