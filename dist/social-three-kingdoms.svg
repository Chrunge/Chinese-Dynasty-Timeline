<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">三国并存</title><desc id="desc">三国历史时间线：公元189年—公元280年，对照政权、君主任期、人物与精选事件。涵盖公元189年汉末群雄割据与三分奠基、220—263年魏蜀吴鼎立、至280年西晋灭吴统一全国。按公元230年查询可得曹魏、蜀汉、孙吴三政权并立；222年孙权建元黄武与229年正式称帝分别维护，不将三国简化为同年建立。；缩略示意，仅展示前 5 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">三国并存</text><text x="64" y="122" fill="#e4c990" font-size="21">公元189年—公元280年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V398" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元189年</text><path d="M455.96 188V398" stroke="#46616a" stroke-dasharray="3 7"/><text x="455.96" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元212年</text><path d="M672.09 188V398" stroke="#46616a" stroke-dasharray="3 7"/><text x="672.09" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元234年</text><path d="M898.04 188V398" stroke="#46616a" stroke-dasharray="3 7"/><text x="898.04" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元257年</text><path d="M1124.00 188V398" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元280年</text><text x="64" y="221" fill="#e4eeee" font-size="18">东汉（汉末群雄奠基</text><path d="M230 215H534.5494505494505" stroke="#355e68" stroke-width="2"/><rect x="230.00" y="205" width="304.55" height="20" rx="3" fill="#355e68" opacity="1"/><rect x="298.77" y="205" width="235.78" height="20" rx="3" fill="#355e68" opacity="1"/><rect x="475.60" y="205" width="68.77" height="20" rx="3" fill="#3