<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">五代十国 · 中国朝代时间线</title><desc id="desc">五代十国历史时间线：公元902年—公元979年，对照政权、君主任期、人物与精选事件。涵盖902年杨行密封吴王、907年朱温代唐建后梁至960年陈桥兵变代后周（后梁三帝、后唐四帝、后晋二帝、后汉二帝、后周三帝共十四帝全谱系），以及十国全部四十一位君主全谱系（杨吴四主、南唐三主、吴越五王、前蜀二帝、后蜀二帝、南汉四帝、马楚六主、闽国六主、荆南五主、北汉四帝），直至979年五月宋太宗攻灭北汉终结分裂。；缩略示意，仅展示前 8 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">五代十国 · 中国朝代时间线</text><text x="64" y="122" fill="#e4c990" font-size="21">公元902年—公元979年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元902年</text><path d="M450.60 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="450.60" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元921年</text><path d="M671.19 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="671.19" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元940年</text><path d="M903.40 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="903.40" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元960年</text><path d="M1124.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元979年</text><text x="64" y="221" fill="#e4eeee" font-size="18">后梁</text><path d="M288.05194805194805 215H473.8181818181818" stroke="#7a5240" stroke-width="2"/><rect x="288.05" y="205" width="58.05" height="20" rx="3" fill="#7a5240" opacity="1"/><rect x="346.10" y="205" width="11.61" height="20" rx="3" fill="#7a5240" opa