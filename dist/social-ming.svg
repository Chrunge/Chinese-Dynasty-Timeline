<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">明朝专卷（大明十六帝全谱系、南明四朝与明郑三代、北元瓦剌鞑靼与内阁心学科技）</title><desc id="desc">明朝历史时间线：公元1368年—公元1683年，对照政权、君主任期、人物与精选事件。涵盖1368年朱元璋于应天称帝建立大明至1644年崇祯帝自缢煤山（完整收录洪武、建文、永乐、洪熙、宣德、正统/天顺、景泰、成化、弘治、正德、嘉靖、隆庆、万历、泰昌、天启、崇祯全部十六位明朝皇帝共十七段任期），以及北元（瓦剌也先、鞑靼俺答汗）、李自成大顺、张献忠大西、南明（弘光、隆武、鲁王监国、永历）与台湾明郑三代延；缩略示意，仅展示前 6 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">明朝专卷（大明十六帝全谱系、南明四朝与明郑三代、北元瓦</text><text x="64" y="122" fill="#e4c990" font-size="21">公元1368年—公元1683年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1368年</text><path d="M454.21 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="454.21" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1447年</text><path d="M675.58 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="675.58" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1525年</text><path d="M899.79 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="899.79" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1604年</text><path d="M1124.00 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1683年</text><text x="64" y="221" fill="#e4eeee" font-size="18">明朝</text><path d="M230 215H1013.3142857142857" stroke="#8c3b32" stroke-width="2"/><rect x="230.00" y="205" width="85.14" height="20" rx="3" fill="#8c3b32" opacity="1"/><rect x="315.14" y="205" width="11.35" height