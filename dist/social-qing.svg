<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">大清帝国 · 历史对照图</title><desc id="desc">清朝历史时间线：公元1616年—公元1912年，对照政权、君主任期、人物与精选事件。涵盖1616年努尔哈赤建立后金、1636年皇太极改国号大清、1644年顺治帝入关定都北京，至1912年2月12日宣统帝溥仪颁布退位诏书（完整收录天命、天聪/崇德、顺治、康熙、雍正、乾隆、嘉庆、道光、咸丰、同治、光绪、宣统全部十二位君主及多尔衮、鳌拜、慈禧辅政/垂帘），并包含晚明、大顺、南明明郑、吴三桂三藩吴周政权（；缩略示意，仅展示前 7 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">大清帝国 · 历史对照图</text><text x="64" y="122" fill="#e4c990" font-size="21">公元1616年—公元1912年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V476" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1616年</text><path d="M453.50 188V476" stroke="#46616a" stroke-dasharray="3 7"/><text x="453.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1690年</text><path d="M677.00 188V476" stroke="#46616a" stroke-dasharray="3 7"/><text x="677.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1764年</text><path d="M900.50 188V476" stroke="#46616a" stroke-dasharray="3 7"/><text x="900.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1838年</text><path d="M1124.00 188V476" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1912年</text><text x="64" y="221" fill="#e4eeee" font-size="18">后金 / 清朝</text><path d="M230 215H1124" stroke="#1f4e5f" stroke-width="2"/><rect x="230.00" y="205" width="30.20" height="20" rx="3" fill="#1f4e5f" opacity="1"/><rect x="260.20" y="205" width="51.34" height="20" rx="3" fill="#1f4e5f" opacity="1"/><rect x="