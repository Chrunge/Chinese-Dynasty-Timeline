<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">宋辽金夏 · 中国朝代时间线</title><desc id="desc">辽金宋历史时间线：公元907年—公元1279年，对照政权、君主任期、人物与精选事件。涵盖907年耶律阿保机建契丹至1125年辽亡（辽朝九帝全谱系及1124—1218年耶律大石西辽）、960年陈桥兵变至1127年靖康之变（北宋九帝全谱系）、1127年建炎南渡至1279年崖山海战（南宋九帝全谱系）、982/1038年党项兴起至1227年亡于蒙古（西夏二太祖太宗与十帝全谱系）、1115年阿骨打建金至12；缩略示意，仅展示前 8 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">宋辽金夏 · 中国朝代时间线</text><text x="64" y="122" fill="#e4c990" font-size="21">公元907年—公元1279年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元907年</text><path d="M453.50 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="453.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1000年</text><path d="M677.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="677.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1093年</text><path d="M900.50 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="900.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1186年</text><path d="M1124.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1279年</text><text x="64" y="221" fill="#e4eeee" font-size="18">辽朝（契丹）</text><path d="M230 215H753.9032258064516" stroke="#3d647a" stroke-width="2"/><rect x="230.00" y="205" width="45.66" height="20" rx="3" fill="#3d647a" opacity="1"/><rect x="275.66" y="205" width="50.47" height="20" rx="3" fill="#3d647a" opacity=