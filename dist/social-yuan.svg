<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">元朝专卷（大蒙古国与大元十八汗帝及监国称制全谱系、行省宣政院建制与元末群雄）</title><desc id="desc">元朝历史时间线：公元1206年—公元1368年，对照政权、君主任期、人物与精选事件。涵盖1206年铁木真建立大蒙古国至1368年元顺帝北奔上都（含太祖成吉思汗、拖雷监国、太宗窝阔台、乃马真后称制、定宗贵由、海迷失后称制、宪宗蒙哥、世祖忽必烈、成宗铁穆耳、武宗海山、仁宗爱育黎拔力八达、英宗硕德八剌、泰定帝也孙铁木儿、天顺帝阿速吉八、文宗图帖睦尔、明宗和世琜、宁宗懿璘质班、顺帝妥懽贴睦尔共十八位最高统；缩略示意，仅展示前 8 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">元朝专卷（大蒙古国与大元十八汗帝及监国称制全谱系、行省</text><text x="64" y="122" fill="#e4c990" font-size="21">公元1206年—公元1368年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1206年</text><path d="M450.74 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="450.74" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1246年</text><path d="M677.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="677.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1287年</text><path d="M897.74 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="897.74" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1327年</text><path d="M1124.00 188V515" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">公元1368年</text><text x="64" y="221" fill="#e4eeee" font-size="18">大蒙古国 / 元朝</text><path d="M230 215H1124" stroke="#264653" stroke-width="2"/><rect x="230.00" y="205" width="115.89" height="20" rx="3" fill="#264653" opacity="1"/><rect x="345.89" y="205" width="11.04" height="20" 