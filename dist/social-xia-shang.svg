<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">夏商周初 · 历史对照图</title><desc id="desc">夏商历史时间线：前2070年—前1046年，对照政权、君主任期、人物与精选事件。涵盖约公元前2070年大禹阳城受命建夏、夏启甘之战确立世袭、太康失国与后羿寒浞代夏、少康中兴至约前1600年夏桀亡于鸣条之战（夏代十四世十七王全谱系），以及商族先公（契、王亥、上甲微）、成汤建商、伊尹放太甲、太戊中兴、九世之乱、约前1300年盘庚迁殷、武丁与妇好盛世、祖甲改制至前1046年牧野之战商亡周兴（商代三十王全；缩略示意，仅展示前 6 个政权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122c36"/><stop offset="1" stop-color="#203e43"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><rect x="38" y="38" width="7" height="83" rx="3" fill="#e4c990"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="85" fill="#ffffff" font-size="38" font-weight="700">夏商周初 · 历史对照图</text><text x="64" y="122" fill="#e4c990" font-size="21">前2070年—前1046年 · 政权 / 君主任期 / 精选事件</text><path d="M230.00 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="230.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前2070年</text><path d="M453.50 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="453.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前1814年</text><path d="M677.00 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="677.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前1558年</text><path d="M900.50 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="900.50" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前1302年</text><path d="M1124.00 188V437" stroke="#46616a" stroke-dasharray="3 7"/><text x="1124.00" y="176" text-anchor="middle" fill="#bdcfd2" font-size="15">前1046年</text><text x="64" y="221" fill="#e4eeee" font-size="18">夏朝（夏后氏）</text><path d="M230 215H640.33203125" stroke="#7a5c43" stroke-width="2"/><rect x="230.00" y="205" width="39.29" height="20" rx="3" fill="#7a5c43" opacity="0.8" stroke="#ffffff" stroke-width="1.5"/><rect x="270.16" y="205" width="33.18" height="20" rx="3